---
layout: default
---
<div class="hero">
  <img class="photo" src="{{ '/assets/me.jpg' | relative_url }}" alt="{{ site.title }}">
  <div>
    <h1>{{ site.title }}</h1>
    <p class="hero-tagline">{{ site.tagline }}</p>
  </div>
</div>
{{ content }}

{% if site.posts.size > 0 %}
<h2 class="section-title">Recent writing</h2>
{% include post-list.html posts=site.posts max=5 %}
{% if site.posts.size > 5 %}<p><a href="{{ '/blog/' | relative_url }}">All posts &rarr;</a></p>{% endif %}
{% endif %}
