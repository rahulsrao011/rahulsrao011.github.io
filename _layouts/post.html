---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1><a class="back" href="{{ '/writing/' | relative_url }}" aria-label="All posts">&larr;</a> {{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
